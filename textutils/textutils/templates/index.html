<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome to Text Analyzer</h1>
    <form action="/analyze" method="get">
        <textarea name="text" style="height: 130px ;width: 500px; "></textarea><br>
        <input type="checkbox" name='removepunc' > Remove Punction<br>
        <input type="checkbox" name='capitalize' > Convert to Uppercase<br>
        <input type="checkbox" name='newlineremover' > New Line Remover<br>
        <input type="checkbox" name='extraspaceremover'> Extra Space Remover<br>
        <input type="checkbox" name='countchar'> Counting charactersr<br>

        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
