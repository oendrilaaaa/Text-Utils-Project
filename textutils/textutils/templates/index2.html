<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Utils</title>
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
          name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS -->
        <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous"
        />

        <title>Text Utils</title>
      </head>
      <body>
        <script
          src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
          integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
          crossorigin="anonymous"
        ></script>
        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
          crossorigin="anonymous"
        ></script>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
          <a class="navbar-brand" href="#">TextUtils.com</a>
          <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
              <li class="nav-item active">
                <a class="nav-link" href="#"
                  >Home <span class="sr-only">(current)</span></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-toggle="dropdown"
                  aria-expanded="false"
                >
                  Dropdown link
                </a>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="#">Action</a>
                  <a class="dropdown-item" href="#">Another action</a>
                  <a class="dropdown-item" href="#">Something else here</a>
                </div>
              </li>
            </ul>
          </div>
          <a class="navbar-brand">Navbar</a>
          <form class="form-inline">
            <input
              class="form-control mr-sm-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
              Search
            </button>
          </form>
        </nav>
        <div class="alert alert-success" role="alert">
          <h4 class="alert-heading">Hello!</h4>
          <p>
            Welcome to text utils page! you can do anything with your text here
          </p>
        </div>
        <div class="container">
          <form action="/analyze" method="post"> {% csrf_token %}
            <div class="form-group">
              <label for="exampleFormControlTextarea1"
                >Write your text here</label
              >
              <textarea
                class="form-control"
                id="exampleFormControlTextarea1"
                rows="7"
                name="text"
              ></textarea>
            </div>

            <!-- <input type="checkbox" name="removepunc" /> Remove Punction<br /> -->
            <div class="custom-control custom-switch">
              <input
                type="checkbox"
                name="removepunc"
                class="custom-control-input"
                id="customSwitch1"
              />
              <label class="custom-control-label" for="customSwitch1"
                >Remove Punctuations</label
              >
            </div>
            <div class="custom-control custom-switch">
              <input
                type="checkbox"
                name="newlineremover"
                class="custom-control-input"
                id="customSwitch2"
              />
              <label class="custom-control-label" for="customSwitch2"
                >New Line Remover</label
              >
            </div>

            <div class="custom-control custom-switch">
              <input
                type="checkbox"
                name="extraspaceremover"
                class="custom-control-input"
                id="customSwitch3"
              />
              <label class="custom-control-label" for="customSwitch3"
                >Extra Space Remover</label
              >
            </div>

            <div class="custom-control custom-switch">
              <input
                type="checkbox"
                name="countchar"
                class="custom-control-input"
                id="customSwitch4"
              />
              <label class="custom-control-label" for="customSwitch4"
                >Count Characters</label
              >
            </div>
            <br />
            <button type="submit">Submit</button>
          </form>
        </div>
      </body>
    </html>
  </body>
</html>
